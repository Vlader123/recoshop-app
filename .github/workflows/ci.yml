name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: recoshop, POSTGRES_PASSWORD: recoshop, POSTGRES_DB: recoshop }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U recoshop" --health-interval 3s --health-retries 20
    env:
      DATABASE_URL: postgres://recoshop:recoshop@localhost:5432/recoshop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: cd backend && npm ci && npm test
      - run: cd frontend && npm ci && npm run build
