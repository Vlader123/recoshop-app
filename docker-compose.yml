services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: recoshop
      POSTGRES_PASSWORD: recoshop
      POSTGRES_DB: recoshop
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recoshop"]
      interval: 3s
      retries: 20

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgres://recoshop:recoshop@db:5432/recoshop
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      CORS_ORIGIN: http://localhost:8080
      SEED_ON_START: "true"
      KAFKA_BROKERS: ${KAFKA_BROKERS:-}
    ports: ["3000:3000"]
    depends_on:
      db: { condition: service_healthy }

  web:
    build: ./frontend
    ports: ["8080:80"]
    depends_on: [api]

  kafka:
    profiles: [kafka]
    image: apache/kafka:3.8.0
    ports: ["9092:9092"]

  consumer:
    profiles: [kafka]
    build: ./backend
    command: ["node", "dist/events/consumer.js"]
    environment:
      DATABASE_URL: postgres://recoshop:recoshop@db:5432/recoshop
      KAFKA_BROKERS: kafka:9092
    depends_on:
      db: { condition: service_healthy }
      kafka: { condition: service_started }

volumes:
  pgdata:
